<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하이와 함께하는 HR Level-up</title>
<meta name="description" content="인사·노무 현장의 질문을 법령과 공개 데이터로 풀어 보는 HR 도구 모음.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="hero">
    <div class="badge" id="owner"></div>
    <h1 id="headline"></h1>
    <p id="intro" class="muted"></p>
    <nav class="jump"><a href="#cards">만든 것</a><a href="#proposal">제안</a></nav>
  </header>

  <section id="cards" class="cards"></section>

  <section id="proposal" class="proposal" hidden>
    <div class="label">제안</div>
    <h2 id="p-title"></h2>
    <p class="ask" id="p-ask"></p>
    <h3>근거</h3><ul id="p-evidence"></ul>
    <h3>틀린다면</h3><ul id="p-wrong"></ul>
    <h3>하지 말 것</h3><p id="p-dont"></p>
  </section>

  <footer class="fineprint">각 도구의 정답과 숫자는 법령 원문과 공개 데이터에서 가져왔고, 도구 안에 기준일을 함께 적었습니다.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
