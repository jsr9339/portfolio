<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하이와 함께하는 HR Level-up</title>
<meta name="description" content="인사·노무 현장의 질문을 법령과 공개 데이터로 풀어 보는 HR 도구 모음.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="tag"><span><span id="owner"></span> · HR PORTFOLIO</span></div>
  <h1><span id="headline"></span><br><em id="headline-em"></em></h1>
  <p id="intro" class="intro"></p>
  <nav class="cta"><a class="p" href="#cards">만든 것 보기</a><span class="done" id="done"></span><a class="s" id="to-proposal" href="#proposal" hidden>제안</a></nav>
</div></header>

<main class="wrap">
  <div class="sec-title"><h2>만든 것</h2><span>매주 한 칸씩 채워집니다</span></div>
  <section id="cards" class="cards"></section>

  <section id="proposal" class="proposal" hidden>
    <div class="label">제안</div>
    <h2 id="p-title"></h2>
    <p class="ask" id="p-ask"></p>
    <h3>근거</h3><ul id="p-evidence"></ul>
    <h3>틀린다면</h3><ul id="p-wrong"></ul>
    <h3>하지 말 것</h3><p id="p-dont"></p>
  </section>

  <div class="sec-title" id="values-title" hidden><h2>일하는 방식</h2></div>
  <section id="values" class="values"></section>

  <footer class="fineprint">각 도구의 정답과 숫자는 법령·시행규칙 원문과 공개 데이터에 근거하고,<br>도구 안에 기준일을 함께 적었습니다.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
